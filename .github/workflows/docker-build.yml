name: Build and Push WebGoat Docker Image (Corretto JDK)

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Amazon Corretto JDK 11 설치
      - name: Set up Amazon Corretto JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: corretto

      # 3. Maven으로 WebGoat 빌드
      - name: Build WebGoat JAR
        run: |
          mvn clean package -DskipTests
          ls -lh webgoat-server/target

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 태그 지정
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:v8.2.0-SNAPSHOT \
            -f ./webgoat-server/Dockerfile webgoat-server\
            webgoat-server

      # 6. Docker Hub로 이미지 푸시
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:v8.2.0-SNAPSHOT